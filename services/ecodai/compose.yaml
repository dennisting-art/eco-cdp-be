services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eco
      POSTGRES_PASSWORD: eco
      POSTGRES_DB: eco
    ports:
      - "55434:5432"
    volumes:
      - ecodai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eco -d eco"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrations:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://eco:eco@postgres:5432/eco?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ecodai_postgres_data:
