openapi: 3.0.3
info:
  title: CDP v0 API
  version: 0.1.0
  description: eco-cdp-be Customer Intelligence v0 APIs and internal utilities.
servers:
  - url: http://localhost:8080
  - url: http://eco-cdp-be:8080
security:
  - bearerAuth: []
paths:
  /api/v0/customer-intelligence/cards:
    post:
      summary: Read Customer Intelligence charts for one scope
      operationId: queryCustomerIntelligenceCards
      tags: [Customer Intelligence]
      description: |
        Requires `cdphub.cust_intel.view` or the literal `cdphub.*` grant. Omitted,
        null, or empty `scope_code` selects AEON; an explicit scope such as ABG
        selects that scope.
        Enabled monthly trends contain the latest six calendar months in
        Malaysia time, including the current month to date. Missing months
        contain null values, while published zero counts remain zero.
        `active_pre` reads the same month one
        year earlier. Penetration percent is a ratio from 0 to 1.
        Valid enabled features remain available when another independent
        feature is unavailable or invalid. Such responses use status
        `partial`, omit the failed feature, and include a warning identifying
        it. Disabled features remain present. Database and request-level
        failures still reject the whole request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardsRequest'
            examples:
              aeon: {value: {scope_code: ''}}
              opco: {value: {scope_code: ABG}}
      responses:
        '200':
          description: Complete or partially available configured features and their reporting data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  trace_id: {type: string}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/CardsResponse'}
        '400': {description: Invalid request body or scope code}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {description: Customer Intelligence permission denied}
        '404': {description: Scope missing or unavailable}
        '500': {description: All enabled features invalid, invalid endpoint configuration, or database error}
        '503': {description: All enabled features unavailable}
  /api/v0/customer-intelligence/universe:
    post:
      summary: Read the latest Customer Intelligence Universe charts
      operationId: queryCustomerIntelligenceUniverse
      tags: [Customer Intelligence]
      description: |
        Requires `cdphub.cust_intel.view` or the literal `cdphub.*` grant.
        Each chart and enabled Op-Co card selects its own latest reporting date. `as_of_date`
        is the newest included date, while `as_of_dates` gives the date of each chart.
        Ratios are fractions from 0 to 1; growth may be negative or above 1.
        The group-scoped MEMBER_MATRIX_ACTIVITY feature controls matrix visibility.
        When enabled, matrix rows and columns include Op-Cos present in the latest
        matrix snapshot, even when their detail view is unavailable. Every directed
        relationship and primary total is required. When the feature is disabled,
        the matrix is null without a data warning. Disabled Op-Co cards have null
        counts and date.
        Valid charts remain available when another independent chart is missing or invalid.
        Such responses use status `partial`, return null for the failed chart, and include
        a warning. A response with no usable chart returns an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UniverseRequest'
            example: {start_date: '', end_date: ''}
      responses:
        '200':
          description: Latest complete or partially available Universe charts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  trace_id: {type: string}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/UniverseResponse'}
        '400': {description: Invalid JSON or date filtering requested}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {description: Universe permission denied}
        '500': {description: Invalid reporting configuration or database error}
        '503': {description: Required latest chart data unavailable}
  /api/v0/internal/access:
    get:
      operationId: checkAccess
      tags: [Internal Authentication]
      summary: Validate a caller token
      responses:
        '200': {description: Valid token}
        '401': {description: Invalid token}
  /api/v0/internal/self-pilot/token:
    post:
      operationId: issueSelfPilotToken
      tags: [Internal Authentication]
      summary: Issue an internal test token
      description: Available only in Local, Dev, and UAT when enabled. Dev and UAT ingress must restrict this endpoint to the internal network. No caller authentication is required. Send an empty body or `{}`. eco-cdp-be issues the fixed cdphub_tester profile with its configured token TTL. The profile grants the literal cdphub.* permission, which matches CDP Hub permissions only. Restart revokes issued tokens.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
            example: {}
      responses:
        '200':
          description: Token issued; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  trace_id: {type: string}
                  data:
                    type: object
                    properties:
                      access_token: {type: string}
                      token_type: {type: string, enum: [Bearer]}
                      expires_in: {type: integer}
                      profile: {type: string}
        '400': {description: Invalid request}
        '429': {description: Rate limit exceeded}
components:
  schemas:
    CardsRequest:
      type: object
      additionalProperties: false
      description: Omitted, null, or empty string scope_code selects AEON. Whitespace is invalid.
      properties:
        scope_code: {type: string, nullable: true, default: null, example: ABG}
    CardsActivityPoint:
      type: object
      required: [date, active, active_pre, inactive]
      properties:
        date: {type: string, format: date, description: First day of the report month}
        active: {type: integer, format: int64, nullable: true}
        active_pre: {type: integer, format: int64, nullable: true, description: Same month in the previous year}
        inactive: {type: integer, format: int64, nullable: true}
    CardsMetricPoint:
      type: object
      required: [label, count, percent]
      properties:
        label: {type: string}
        count: {type: integer, format: int64, nullable: true}
        percent: {type: number, format: double, nullable: true, description: Ratio from 0 to 1}
    CardsSummaryMetric:
      type: object
      required: [label, count, percent]
      properties:
        label: {type: string}
        count: {type: integer, format: int64}
        percent: {type: number, format: double, nullable: true, description: Ratio from 0 to 1; null when not applicable or when total members is zero}
        growth: {type: number, format: double, description: Optional growth ratio when a comparison period is defined}
        compare: {type: integer, format: int64, description: Optional comparison count when a comparison period is defined}
    CardsFeature:
      type: object
      required: [feature_code, display_name, type, is_enabled]
      properties:
        feature_code: {type: string}
        display_name: {type: string}
        type: {type: string, enum: [TREND, DISTRIBUTION, COMBO_TREND]}
        is_enabled: {type: boolean}
        trend:
          type: array
          description: Present for TREND or COMBO_TREND; [] when disabled.
          items:
            oneOf:
              - {$ref: '#/components/schemas/CardsActivityPoint'}
              - {$ref: '#/components/schemas/CardsMetricPoint'}
        buckets:
          type: array
          description: Present for DISTRIBUTION; [] when disabled.
          items: {$ref: '#/components/schemas/CardsMetricPoint'}
        summary:
          type: object
          description: Present for enabled MVC; keyed by total_members, active_members, and at_risk_customers. Other features omit it.
          additionalProperties: {$ref: '#/components/schemas/CardsSummaryMetric'}
    CardsWarning:
      type: object
      required: [feature_code, code, message]
      properties:
        feature_code: {type: string, description: Stable identifier of the omitted failed feature}
        code: {type: string, enum: [FEATURE_DATA_UNAVAILABLE, FEATURE_DATA_INVALID]}
        message: {type: string, description: Safe user-facing warning without internal details}
    CardsResponse:
      type: object
      required: [status, warnings, scope_code, features]
      properties:
        status: {type: string, enum: [complete, partial]}
        warnings:
          type: array
          description: One warning for each failed enabled feature omitted from features; empty for complete responses.
          items: {$ref: '#/components/schemas/CardsWarning'}
        scope_code: {type: string}
        features:
          type: array
          description: Successful enabled features and all disabled features in configured order.
          items: {$ref: '#/components/schemas/CardsFeature'}
    UniverseRequest:
      type: object
      additionalProperties: false
      description: Omitted date fields default to blank. Nonblank dates are currently rejected.
      properties:
        start_date: {type: string, default: '', example: ''}
        end_date: {type: string, default: '', example: ''}
    UniverseMetric:
      type: object
      required: [count]
      properties:
        label: {type: string}
        count: {type: integer, format: int64, nullable: true}
        percent: {type: number, format: double, description: Ratio from 0 to 1; omitted when denominator unavailable}
        growth: {type: number, format: double, description: Signed growth ratio; omitted without a comparable baseline}
        compare: {type: integer, format: int64, description: Signed acquisition delta}
    UniverseScope:
      type: object
      required: [scope_code, display_name]
      properties:
        scope_code: {type: string}
        display_name: {type: string}
    UniverseOpco:
      type: object
      required: [scope_code, is_enabled, total_retail_count, member, non_member]
      properties:
        scope_code: {type: string}
        is_enabled: {type: boolean}
        total_retail_count: {type: integer, format: int64, nullable: true}
        member:
          nullable: true
          allOf: [{$ref: '#/components/schemas/UniverseMetric'}]
        non_member:
          nullable: true
          allOf: [{$ref: '#/components/schemas/UniverseMetric'}]
    UniverseMatrix:
      type: object
      required: [columns, rows]
      properties:
        columns: {type: array, items: {type: string}}
        rows:
          type: array
          items:
            type: object
            required: [primary_entity, relationships]
            properties:
              primary_entity: {$ref: '#/components/schemas/UniverseMetric'}
              relationships: {type: array, items: {$ref: '#/components/schemas/UniverseMetric'}}
    UniverseResponse:
      type: object
      required: [status, warnings, as_of_date, as_of_dates, scopes, group, opcos]
      properties:
        status: {type: string, enum: [complete, partial]}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/UniverseWarning'}
        as_of_date: {type: string, format: date, description: Newest successfully included chart date}
        as_of_dates:
          type: object
          properties:
            group: {type: object, additionalProperties: {type: string, format: date, nullable: true}}
            opcos: {type: object, additionalProperties: {type: string, format: date, nullable: true}}
        scopes: {type: array, items: {$ref: '#/components/schemas/UniverseScope'}}
        group:
          type: object
          required: [total_members, latest_member_growth, member_activity, member_penetration_retail, non_member_transaction_retail, annual_member_acquisition, entity_member_count, member_matrix_activity]
          properties:
            total_members: {nullable: true, allOf: [{$ref: '#/components/schemas/UniverseMetric'}]}
            latest_member_growth: {nullable: true, allOf: [{$ref: '#/components/schemas/UniverseMetric'}]}
            member_activity:
              type: object
              nullable: true
              properties:
                active: {$ref: '#/components/schemas/UniverseMetric'}
                inactive: {$ref: '#/components/schemas/UniverseMetric'}
            member_penetration_retail: {nullable: true, allOf: [{$ref: '#/components/schemas/UniverseMetric'}]}
            non_member_transaction_retail: {nullable: true, allOf: [{$ref: '#/components/schemas/UniverseMetric'}]}
            annual_member_acquisition: {type: array, nullable: true, items: {$ref: '#/components/schemas/UniverseMetric'}}
            entity_member_count: {type: array, nullable: true, items: {$ref: '#/components/schemas/UniverseMetric'}}
            member_matrix_activity: {nullable: true, allOf: [{$ref: '#/components/schemas/UniverseMatrix'}]}
        opcos: {type: array, items: {$ref: '#/components/schemas/UniverseOpco'}}
    UniverseWarning:
      type: object
      required: [chart, code, message]
      properties:
        chart: {type: string, description: Stable chart identifier}
        scope_code: {type: string, description: Present for a failed Op-Co card}
        code: {type: string, enum: [CHART_DATA_UNAVAILABLE, CHART_DATA_INVALID]}
        message: {type: string, description: Safe user-facing warning without internal details}
    ErrorResponse:
      type: object
      properties:
        success: {type: boolean}
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
  responses:
    UnauthorizedError:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
