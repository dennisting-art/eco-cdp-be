stages:
  - build

eco-cdp-be-pipeline:
  stage: build
  trigger:
    include:
      - local: .gitlab/ci/eco-cdp-be.yml
    strategy: depend
  rules:
    - changes:
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
        - Dockerfile
        - Dockerfile.migrations
        - go.mod
        - go.sum
        - pkg/**/*
        - internal/**/*
        - services/**/*
        - migrations/**/*
