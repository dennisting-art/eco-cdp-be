stages:
  - build

ecodai-pipeline:
  stage: build
  trigger:
    include:
      - local: services/ecodai/ci/service.yml
    strategy: depend
  rules:
    - changes:
        - .gitlab-ci.yml
        - services/**/*

migration-image-pipeline:
  stage: build
  trigger:
    include:
      - local: services/ecodai/ci/migrations.yml
    strategy: depend
  rules:
    - changes:
        - .gitlab-ci.yml
        - services/ecodai/ci/migrations.yml
        - services/ecodai/Dockerfile.migrations
        - services/ecodai/migrations/**/*
