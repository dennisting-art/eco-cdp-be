stages:
  - build

eco-cdp-be-pipeline:
  stage: build
  trigger:
    include:
      - local: services/eco/ci/service.yml
    strategy: depend
  rules:
    - changes:
        - .gitlab-ci.yml
        - services/**/*

migration-image-pipeline:
  stage: build
  trigger:
    include:
      - local: services/eco/ci/migrations.yml
    strategy: depend
  rules:
    - changes:
        - .gitlab-ci.yml
        - services/eco/ci/migrations.yml
        - services/eco/Dockerfile.migrations
        - services/eco/migrations/**/*
